<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Applications Mobiles — Administration</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">TRILLION SOFTWARE</div><button class="logout" data-logout>Déconnexion</button></header><main class="admin-page"><section class="admin-head"><div class="section-label">ADMINISTRATEUR</div><h1>Applications Mobiles</h1><p>Ajoutez autant d’applications que nécessaire. Les logos/images doivent être carrés, en 3×3 ou 4×4, avec nom et description.</p></section><section class="admin-panel"><h2>Ajouter une application</h2><form id="appForm" class="admin-form"><label>Logo / image (3×3 ou 4×4)<input id="appImage" type="file" accept="image/*" required></label><label>Nom de l’application<input id="appName" required maxlength="120"></label><label>Description<textarea id="appDescription" rows="6" required></textarea></label><button class="primary-btn" type="submit">Ajouter l’application</button></form></section><section class="admin-panel"><h2>Applications ajoutées</h2><div id="appList"></div></section></main><script src="admin.js"></script></body></html>
